id: encapsulation.ex01
statement: 「未適用」のコードを、カプセル化を使って書き直してください。シフト位置を外から直接書き換えられないようにし、切り替えの規則を1か所にまとめます。
additionalSpec: |
  N から D に入れるときは、ブレーキを踏んでいることを条件に加えてください（ブレーキを踏まずに N から D に入れると、車が急に動き出す恐れがあるため）。

  - 切り替えの要求に、ブレーキを踏んでいるかどうかを加えます。
  - 表示にも、車速の後ろに `ブレーキON` または `ブレーキOFF` を加えます。例: `N→D 0km/h ブレーキOFF 拒否 現在N`
  - `Main` の要求の並びは、N から D への切り替えを、ブレーキを踏まないときと踏んだときの両方で試せるように書き換えてください（模範解答では、P→N、N→D（ブレーキなし）、N→D（ブレーキあり）、D→R（走行中）、P ボタンの5件にしています）。
checks:
- id: encapsulation.ex01.c1
  text: シフト位置を、外から直接書き換えられない
- id: encapsulation.ex01.c2
  text: 切り替えの規則（走行中の R、N から D のブレーキ）が1か所にまとまっている
- id: encapsulation.ex01.c3
  text: 拒否したことを、呼び出す側が戻り値で知れる
