id: encapsulation
order: 2
title: カプセル化
theme: シフト位置の管理
summary: データの変え方を決まった入口に限り、規則を1か所で守る
spec: |
  変速機（トランスミッション。エンジンの回転を車輪に伝える装置）のシフト位置を管理するプログラムです。シフト位置は次の4つのどれかで、最初は P です。

  | 位置 | 意味 |
  | --- | --- |
  | P | 駐車（パーキング）。車輪を固定する |
  | R | 後退（リバース） |
  | N | 中立（ニュートラル）。エンジンの力を車輪に伝えない |
  | D | 前進（ドライブ） |

  切り替えの要求は、2つの操作から届きます。

  - シフトレバー: 運転者が選んだ位置への切り替えを要求する
  - P ボタン: P への切り替えを要求する（ボタンで P に入れる車があります）

  要求には、そのときの車速（km/h）が付いています。プログラムは要求を順に処理し、受け付けたか拒否したかと、現在の位置を表示します。

  切り替えの規則は「走行中（車速が 0 でない）は R に入れない」の1つです。

  表示の例: `D→R 20km/h 拒否 現在D`（車速 20km/h のときに D から R への切り替えを要求されたが、拒否したので D のまま）

  ※ 実際の車の仕組みを、学習用に簡略化したモデルです。簡単にするため、P・R・N・D 以外の値が要求されたときの確かめは省いています。
