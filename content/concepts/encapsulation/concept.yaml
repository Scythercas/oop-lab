id: encapsulation
order: 2
title: カプセル化
theme: シフト位置の管理
summary: データの変え方を決まった入口に限り、規則を1か所で守る
spec: |
  変速機（エンジンの力を車輪に伝える装置）のシフト位置を管理するプログラムです。

  ::: 図 spec

  - 規則: 走行中（車速が 0 でない）は R に入れない
  - 表示の例: `D→R 20km/h 拒否 現在D`
  - ※ 実際の車の仕組みを、学習用に簡略化したモデルです

  ::: くわしく

  | 位置 | 意味 |
  | --- | --- |
  | P | 駐車（パーキング）。車輪を固定する |
  | R | 後退（リバース） |
  | N | 中立（ニュートラル）。エンジンの力を車輪に伝えない |
  | D | 前進（ドライブ） |

  - 最初の位置は P です。
  - 切り替えの要求は、シフトレバー（運転者が選んだ位置を要求する）と、P ボタン（P を要求する。ボタンで P に入れる車があります）の2つから届きます。
  - 要求には、そのときの車速（km/h）が付いています。プログラムは要求を順に処理し、受け付けたか拒否したかと、現在の位置を表示します。
  - 表示の例は「車速 20km/h のときに D から R への切り替えを要求されたが、拒否したので D のまま」という意味です。
  - 簡単にするため、P・R・N・D 以外の値が要求されたときの確かめは省いています。

  :::
