- questionId: encapsulation.q01
  correct: b
  explanation: |
    データの変え方を入口に限り、入口の中で規則を確かめることです。

    ::: くわしく

    カプセル化は、データを非公開にし、変える方法をクラスの入口（メソッド）に限ることです。入口の中で規則を確かめるので、データが規則に反した状態になりません。

    :::
  wrongReasons:
    a: クラスの数とは関係ありません。
    c: 付けるだけでは、自由に書き換えられます。
    d: 読めなくすることではありません。
- questionId: encapsulation.q02
  correct: d
  explanation: |
    目的は、データが規則に反した状態にならないようにすることです。

    ::: くわしく

    カプセル化の目的は、データが規則に反した状態にならないようにすることです。シフト位置を変えられる入口を1つにし、その中で「走行中は R に入れない」を確かめます。

    :::
  wrongReasons:
    a: 表示の速さとは関係ありません。
    b: メモリとは関係ありません。
    c: クラスの数とは関係ありません。
- questionId: encapsulation.q03
  correct: a
  explanation: |
    規則が変速機の入口の1か所にあったので、そこだけを直せば済みました。

    ::: くわしく

    適切な設計では、シフト位置を変えられるのは切り替えの入口（Java の `shiftTo`。言語によって名前が違います）だけで、規則もその中にあります。そのため、規則を足す場所は1か所で済みました。未適用では、シフトレバーと P ボタンの両方に確認を足す必要がありました。

    :::
  wrongReasons:
    b: ファイルの数は同じです。
    c: P ボタンも入口を呼んでいます。
    d: 車速は入口の中で確かめています。
- questionId: encapsulation.q04
  correct: c
  explanation: |
    規則を守らせる仕組みなので、規則を破る要求には専用の入口が要ります。

    ::: くわしく

    カプセル化は規則を守らせる仕組みなので、試験用の設定のように規則を破る要求には、専用の入口を足す必要があります（変更シミュレーションの2つ目の変更要求）。

    :::
  wrongReasons:
    a: 逆に、なりにくくなります。
    b: 直す場所は1か所に減ります。
    d: 入口が結果を返せば知れます。
- questionId: encapsulation.q05
  correct: b
  explanation: |
    規則があり、変える箇所が複数あるデータほど効果が大きくなります。

    ::: くわしく

    守るべき規則があり、変更する箇所が複数あるデータほど、規則を1か所にまとめる効果が大きくなります。

    :::
  wrongReasons:
    a: 守らせる相手がいません。
    c: 規則がなく、受け渡すだけです。
    d: 変えない値には要りません。
- questionId: encapsulation.q06
  correct: a
  explanation: |
    まとめて渡すだけで規則のないデータには、入口は要りません。

    ::: くわしく

    画面に渡すために値をまとめただけのデータには、守るべき規則がありません。こうしたデータに入口を付けても、コードが増えるだけです。

    :::
  wrongReasons:
    b: 範囲という規則があります。
    c: 範囲があり、2か所から変えます。
    d: 上限という規則があります。
- questionId: encapsulation.q07
  correct: d
  explanation: |
    確かめない設定のメソッドでは、外から好きな値を設定できます。

    ::: くわしく

    設定のメソッドが何も確かめなければ、外から好きな値を設定できるので、公開しているのと変わりません（設計比較の「過剰適用」）。規則は入口の中で確かめます。

    :::
  wrongReasons:
    a: 設定のメソッドから変えられます。
    b: 速さは目的ではありません。
    c: 読めることは問題ではありません。
- questionId: encapsulation.q08
  correct: c
  explanation: |
    位置は正しいままですが、「受付」の表示と実際の結果（拒否）が食い違います。

    ::: くわしく

    規則は変速機の中で守られるので、シフト位置は正しいままです（表示の「現在D」も正しい）。しかし、呼び出す側が結果を無視すると、拒否されたことが運転者に伝わらず、表示の「受付」と実際の結果が食い違います。入口の結果は、呼び出す側で必ず使います。

    :::
  wrongReasons:
    a: 規則は変速機の中にあるので、無効になりません。
    b: 拒否のときの表示が誤りになります。
    d: エラーにならないので、気づきにくい誤りです。
- questionId: encapsulation.q09
  correct: a
  explanation: |
    残量が公開されているので、給油の処理を通さずに上限を超えられます。

    ::: くわしく

    給油の処理は上限を確かめていますが、残量の変数が公開されているので、外から直接 `60` などを設定できます。残量を非公開にし、変える方法を給油などの入口に限ります。

    :::
  wrongReasons:
    b: 定数にするのは良い書き方です。
    c: 入口で確かめているのは良い点です。
    d: 単位は関係ありません。
- questionId: encapsulation.q10
  correct: b
  explanation: |
    非公開でも、確かめない設定の入口から範囲外の値を設定できます。

    ::: くわしく

    速さの変数は非公開ですが、設定の入口が何も確かめないので、範囲外の値を自由に設定できます。設定の入口を、範囲を確かめて結果を返す入口（Java と C++ は真偽値を返すメソッド、VBA は Function）に置き換え、範囲外なら値を変えずに「拒否」を返すようにします。

    :::
  wrongReasons:
    a: 設定の入口を通せば、範囲外にできます。
    c: 読めることは問題ではありません。
    d: 公開すると、さらに防げません。
