- questionId: encapsulation.q01
  correct: b
  explanation: カプセル化は、データを非公開にし、変える方法をクラスの入口（メソッド）に限ることです。入口の中で規則を確かめるので、データが規則に反した状態になりません。
  wrongReasons:
    a: クラスやファイルの数は、カプセル化とは関係がありません。
    c: 取得と設定のメソッドを機械的に付けるだけでは、外から自由に書き換えられるので、カプセル化の効果はありません（よくある誤り）。
    d: カプセル化は、コードを読めなくすることではありません。データの変え方を限ることです。
- questionId: encapsulation.q02
  correct: d
  explanation: カプセル化の目的は、データが規則に反した状態にならないようにすることです。シフト位置を変えられる入口を1つにし、その中で「走行中は R に入れない」を確かめます。
  wrongReasons:
    a: 表示の速さは、カプセル化で防ぎたいことではありません。
    b: メモリの使い方は、カプセル化で防ぎたいことではありません。
    c: クラスの数を抑えることは、カプセル化の目的ではありません。
- questionId: encapsulation.q03
  correct: a
  explanation: 適切な設計では、シフト位置を変えられるのは切り替えの入口（Java の `shiftTo`。言語によって名前が違います）だけで、規則もその中にあります。そのため、規則を足す場所は1か所で済みました。未適用では、シフトレバーと P ボタンの両方に確認を足す必要がありました。
  wrongReasons:
    b: 適切な設計も未適用も、ファイルの数は同じです。修正量の差は、規則がまとまっているかどうかから来ています。
    c: 適切な設計でも P ボタンを使っています。P ボタンは切り替えの入口を呼ぶので、自分で確かめる処理を持つ必要がありません。
    d: 適切な設計でも車速を確かめています。確かめる場所が1か所にまとまっている点が違います。
- questionId: encapsulation.q04
  correct: c
  explanation: カプセル化は規則を守らせる仕組みなので、試験用の設定のように規則を破る要求には、専用の入口を足す必要があります（変更シミュレーションの2つ目の変更要求）。
  wrongReasons:
    a: カプセル化すると、規則に反した状態になりにくくなります。これはメリットです。
    b: カプセル化すると、規則を直す場所は1か所に減ります。
    d: 入口が結果を返すように作れば、呼び出す側は結果を知れます。
- questionId: encapsulation.q05
  correct: b
  explanation: 守るべき規則があり、変更する箇所が複数あるデータほど、規則を1か所にまとめる効果が大きくなります。
  wrongReasons:
    a: 1か所でしか使わない一時的な値には、守らせる相手がいないので、効果はほとんどありません。
    c: 規則のない、受け渡すだけのデータに入口を付けても、コードが増えるだけです。
    d: 変えない値には、変え方を限る必要がありません。
- questionId: encapsulation.q06
  correct: a
  explanation: 画面に渡すために値をまとめただけのデータには、守るべき規則がありません。こうしたデータに入口を付けても、コードが増えるだけです。
  wrongReasons:
    b: 取りうる範囲という規則があるので、カプセル化して入口で確かめたいデータです。
    c: 設定できる範囲という規則があり、複数の箇所から変えるので、規則を1か所にまとめる効果が大きいデータです。
    d: 上限という規則を、給油のたびに確かめる必要があります。カプセル化に向いたデータです。
- questionId: encapsulation.q07
  correct: d
  explanation: 設定のメソッドが何も確かめなければ、外から好きな値を設定できるので、公開しているのと変わりません（設計比較の「過剰適用」）。規則は入口の中で確かめます。
  wrongReasons:
    a: 設定のメソッドを通せば、外から変えられます。private にしただけでは守れません。
    b: メソッドを通しても速くはなりません。また、速さはカプセル化の目的ではありません。
    c: 値を読ませることは問題ではありません。問題は、確かめずに書き換えられることです。
- questionId: encapsulation.q08
  correct: c
  explanation: 規則は変速機の中で守られるので、シフト位置は正しいままです（表示の「現在D」も正しい）。しかし、呼び出す側が結果を無視すると、拒否されたことが運転者に伝わらず、表示の「受付」と実際の結果が食い違います。入口の結果は、呼び出す側で必ず使います。
  wrongReasons:
    a: 規則は変速機の中にあるので、表示を変えても規則は無効になりません。
    b: 拒否されたときの表示が誤りになります。
    d: 戻り値を使わなくても、エラーにはなりません。だからこそ気づきにくい誤りです。
- questionId: encapsulation.q09
  correct: a
  explanation: 給油の処理は上限を確かめていますが、残量の変数が公開されているので、外から直接 `60` などを設定できます。残量を非公開にし、変える方法を給油などの入口に限ります。
  wrongReasons:
    b: 上限を定数にするのは良い書き方です。
    c: 上限を確かめる処理が入口の中にあるのは良い点です。問題は、その入口を通らずに変えられることです。
    d: 単位は、カプセル化とは関係がありません。
- questionId: encapsulation.q10
  correct: b
  explanation: 速さの変数は非公開ですが、設定の入口が何も確かめないので、範囲外の値を自由に設定できます。設定の入口を、範囲を確かめて結果を返す入口（Java と C++ は真偽値を返すメソッド、VBA は Function）に置き換え、範囲外なら値を変えずに「拒否」を返すようにします。
  wrongReasons:
    a: 非公開でも、確かめない設定の入口を通せば、範囲外の値を設定できます。
    c: 値を読む入口があること自体は問題ではありません。
    d: 公開すると、さらに防げなくなります。
