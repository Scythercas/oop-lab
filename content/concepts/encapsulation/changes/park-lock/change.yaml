id: encapsulation.park-lock
order: 1
title: 走行中は P に入れない
description: |
  規則に「走行中（車速が 0 でない）は P に入れない」を加えます。シフトレバーからも P ボタンからも同じです。

  ::: くわしく

  走行中に P に入れると、車輪を固定する部品に無理な力がかかり、変速機を傷める恐れがあるためです。

  :::
expectation: proper-fewer
commentary:
  reason: |
    適切な設計は、変速機の入口の中の規則を直すだけ。未適用と過剰適用は、シフトレバーと P ボタンの両方を直します。

    ::: くわしく

    - 適切な設計の入口は、Java では `shiftTo` です（言語によって名前が違います）。
    - 未適用と過剰適用では、シフトレバーの確認を直し、P ボタンには確認を新しく足します。
    - 過剰適用の設定のメソッドは車速を受け取らないので、規則をその中に書くことができません。

    :::
  missRisk: |
    P ボタンへの確認の書き忘れ。

    ::: くわしく

    最初の規則（R の確認）はシフトレバーにしかなかったので、P ボタンにも確認が要ることに気づきにくくなっています。書き換える側が増えるほど（たとえば、ドアを開けたら自動で P に入れる機能を足すと）、確認を書く場所も、漏れる危険も増えます。

    :::
  lesson: 規則を、状態を持つクラスの中に閉じ込めると、規則の変更が1か所で済みます。
