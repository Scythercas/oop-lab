id: encapsulation.park-lock
order: 1
title: 走行中は P に入れない
description: 走行中に P に入れると、車輪を固定する部品に無理な力がかかり、変速機を傷める恐れがあります。そこで、規則に「走行中（車速が 0 でない）は P に入れない」を加えます。シフトレバーからの要求でも、P ボタンからの要求でも同じです。
expectation: proper-fewer
commentary:
  reason: 適切な設計では、規則が変速機の切り替えの入口（Java の `shiftTo`。言語によって名前が違います）の中の1か所にまとまっているので、そこの条件を直すだけで済みます。未適用と過剰適用では、シフトレバーの確認を直し、P ボタンには確認を新しく足す必要があります。過剰適用の設定のメソッドは車速を受け取らないので、規則をその中に書くことができません。
  missRisk: P ボタンへの確認の書き忘れです。最初の規則（R の確認）はシフトレバーにしかなかったので、P ボタンにも確認が要ることに気づきにくくなっています。書き換える側が増えるほど（たとえば、ドアを開けたら自動で P に入れる機能を足すと）、確認を書く場所も漏れる危険も増えます。
  lesson: 状態を変える規則を、状態を持つクラスの中に閉じ込めておくと、規則の追加や変更が1か所で済みます。呼び出す側の数が増えても、直す場所は増えません。
