id: encapsulation.test-override
order: 2
title: 試験用に、規則を無視して任意の位置に設定する
description: 工場の検査では、車を台の上に載せて車輪を回しながら（実際には走っていない状態で）、各位置での変速機の動きを確かめます。車輪が回っているので車速の値は出ていますが、R にも入れて確かめる必要があります。そこで、規則を確かめずに指定した位置へ設定する試験用の道具を加えます。表示は「試験設定」とします。
expectation: proper-not-fewer
commentary:
  reason: 未適用と過剰適用では、シフト位置を外から直接（または確かめない設定のメソッドで）書き換えられるので、試験用の道具を足すだけで済みます。適切な設計では、シフト位置が非公開なので、変速機に試験用の入口（Java の `forceForTest`。言語によって名前が違います）を足す必要があり、その分だけ修正量が増えます。
  missRisk: 試験用の入口が、通常の操作の経路（シフトレバーなど）からも呼ばれてしまうことです。そうなると、規則が素通りされます。この教材のコードは呼び出す側を仕組みで限っていないので、名前とコメントで用途を示し、試験用の道具からだけ呼んでいることをレビューで確かめます。言語の仕組みで呼び出す側を限る方法（Java のパッケージ分け、C++ の `friend` など）もあります。
  lesson: カプセル化は「規則を守らせる」仕組みなので、規則を破る要求には手間がかかります。この手間は、規則を破る経路を意図して作ったことがコードに残る、という意味では利点でもあります。ただし、この経路があると「規則は入口の中で必ず守られる」という保証が崩れます。試験用の機能は試験用のプログラムにだけ含めるなど、本番では使えないようにするのが一般的です。
