id: encapsulation.test-override
order: 2
title: 試験用に、規則を無視して任意の位置に設定する
description: |
  工場の検査用に、規則を確かめずに位置を設定する道具を加えます。表示は「試験設定」です。

  ::: くわしく

  工場の検査では、車を台の上に載せて車輪を回しながら（実際には走っていない状態で）、各位置での変速機の動きを確かめます。車輪が回っているので車速の値は出ていますが、R にも入れて確かめる必要があります。

  :::
expectation: proper-not-fewer
commentary:
  reason: |
    適切な設計は位置が非公開なので、変速機に試験用の入口を足す必要があります。

    ::: 図 override

    ::: くわしく

    - 未適用と過剰適用では、位置を外から直接（または確かめない設定のメソッドで）書き換えられるので、試験用の道具を足すだけで済みます。
    - 適切な設計の試験用の入口は、Java では `forceForTest` です（言語によって名前が違います）。

    :::
  missRisk: |
    試験用の入口を、通常の操作から呼んでしまうこと。

    ::: くわしく

    そうなると、規則が素通りされます。この教材のコードは呼び出す側を仕組みで限っていないので、名前とコメントで用途を示し、試験用の道具からだけ呼んでいることをレビューで確かめます。言語の仕組みで呼び出す側を限る方法（Java のパッケージ分け、C++ の `friend` など）もあります。

    :::
  lesson: |
    規則を破る要求には手間がかかります。本番では使えないようにするのが一般的です。

    ::: くわしく

    この手間は、規則を破る経路を意図して作ったことがコードに残る、という意味では利点でもあります。ただし、この経路があると「規則は入口の中で必ず守られる」という保証が崩れます。試験用の機能は試験用のプログラムにだけ含めるなど、本番では使えないようにします。

    :::
