# 依存ライブラリの更新提案（詳細設計書 §1、要件定義書 NFR-03）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint と @astrojs/check が TypeScript 7 に対応するまでは 6 系にとどめる
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # 型定義は実行環境の Node.js のメジャー版（24）にそろえる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
