# CI とデプロイ（詳細設計書 §9）
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  check-content:
    name: 静的検査・単体テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 依存ライブラリを入れる
        run: npm ci
      - name: 既知の脆弱性の確認（high 以上で失敗）
        run: npm audit --audit-level=high
      - name: 型検査（SA-01）
        run: npm run check
      - name: 静的検査（SA-02・SA-03）
        run: npm run lint
      - name: 教材の検証（V01〜V11）
        run: npm run content:check
      - name: 単体テスト・結合テスト
        run: npm test
      - name: ビルド
        run: npm run build

  check-java:
    name: Java の実行確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: 依存ライブラリを入れる
        run: npm ci
      - name: 確認処理そのもののテスト（UT-CHK）
        run: npm run test:tools
        env:
          CHECK_LANG: java
      - name: 教材の Java のコードの実行確認（CT-02・CT-04）
        run: node tools/ci/run-code-checks.ts --lang java

  check-cpp:
    name: C++ の実行確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 依存ライブラリを入れる
        run: npm ci
      - name: コンパイラの版を記録する
        run: g++ --version
      - name: 確認処理そのもののテスト（UT-CHK）
        run: npm run test:tools
        env:
          CHECK_LANG: cpp
      - name: 教材の C++ のコードの実行確認（CT-03・CT-04）
        run: node tools/ci/run-code-checks.ts --lang cpp

  check-vba-tool:
    name: VBA 確認ツールの単体テスト
    runs-on: windows-latest
    defaults:
      run:
        # ユーザの PC と同じ Windows PowerShell 5.1 で動かす（詳細設計書 §7.1）
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - name: Pester を入れる
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: 単体テスト（UT-VBA-01〜05）
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'tools/vba-verify/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

  check-vba-record:
    name: VBA 確認記録の照合
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 依存ライブラリを入れる
        run: npm ci
      - name: 教材の VBA がすべて Excel で確認済みか照合する（CT-05）
        run: npm run vba:check

  e2e:
    name: E2E テスト（Chromium・Firefox・WebKit）
    needs: check-content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 依存ライブラリを入れる
        run: npm ci
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium firefox webkit
      - name: ビルド
        run: npm run build
      - name: E2E テスト（Wrangler の手元の配信で、配信時のヘッダを反映する）
        run: npm run test:e2e
      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: デプロイ
    needs: [check-content, check-java, check-cpp, check-vba-tool, check-vba-record, e2e]
    # 外部（フォーク）からの Pull Request ではシークレットを渡さないため、デプロイしない
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: シークレットが登録されているか確かめる
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare のシークレットが未登録のため、デプロイを飛ばします（Issue #4 の U1）"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: ビルド
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
      - name: 本番へデプロイ（main）
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'push'
        run: npx wrangler deploy
      - name: プレビューを作る（Pull Request）
        id: preview
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" | tee upload.log
          {
            echo "urls<<EOF"
            grep -oE 'https://[^ ]+\.workers\.dev[^ ]*' upload.log | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: プレビューの URL を Pull Request に書く
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          URLS: ${{ steps.preview.outputs.urls }}
        run: |
          {
            echo "プレビューを更新しました（コミット ${GITHUB_SHA::7}）。"
            echo
            echo "$URLS" | sed 's/^/- /'
          } > comment.md
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --body-file comment.md --edit-last \
            || gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --body-file comment.md
